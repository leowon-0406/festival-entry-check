<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <title>FESTIVAL CHECK</title>
  <style>
    :root{color-scheme:dark;--bg:#050505;--panel:#0d0d0d;--line:#282828;--muted:#929292;--text:#f5f5f5;--ok:#d9ff55;--warn:#ff6558}*{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed}.app{width:min(100%,860px);margin:0 auto;padding:28px 20px 48px}header{padding-bottom:28px;border-bottom:1px solid var(--line)}.eyebrow{margin:0 0 7px;color:var(--muted);font:700 11px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em}h1{margin:0;font-size:clamp(24px,5vw,36px);letter-spacing:-.055em}.count{margin:38px 0 28px}.count strong{display:block;font-size:clamp(82px,20vw,142px);font-weight:750;letter-spacing:-.105em;line-height:.76}.count span{display:block;margin:13px 0 0 3px;color:var(--muted);font:700 12px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em}.entry,.dialog-card{border:1px solid var(--line);background:var(--panel);padding:18px}label{display:block;margin-bottom:10px;color:#bcbcbc;font:700 12px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em}.form-row{display:grid;grid-template-columns:1fr auto;gap:10px}input{min-width:0;height:62px;padding:0 17px;border:1px solid #393939;border-radius:0;outline:0;background:#070707;color:var(--text);font-size:24px;font-weight:700;letter-spacing:.045em}input:focus{border-color:#eee}input::placeholder{color:#525252;font-size:16px;letter-spacing:0}.check{min-width:132px;height:62px;border:1px solid var(--text);border-radius:0;background:var(--text);color:#080808;font-weight:800}.status{min-height:50px;margin:15px 0 0;padding:13px 0 0;border-top:1px solid var(--line);font-weight:750;font-size:15px}.status small{display:block;margin-top:5px;color:var(--muted);font-size:12px;font-weight:600}.status.warn{color:var(--warn)}.status.ok{color:var(--ok)}.confirm{margin-top:15px;padding:18px;border:1px solid #424242;background:#070707;text-align:center}.confirm[hidden],.screen[hidden]{display:none}.confirm.error{border-color:var(--warn)}.confirm p{margin:0;color:#aaa;font:700 12px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em}.confirm.error p{color:var(--warn)}.confirm strong{display:block;margin:8px 0 18px;color:var(--text);font-size:31px;letter-spacing:.04em}.confirm-actions{display:grid;grid-template-columns:1fr 92px;gap:9px}.confirm-actions.single{grid-template-columns:1fr}.confirm-actions button,.dialog-actions button{height:46px;border-radius:0;font-weight:800}.pay{border:1px solid var(--ok);background:var(--ok);color:#0c0c0c}.confirm.error .pay{border-color:var(--warn);background:var(--warn)}.cancel{border:1px solid #484848;background:transparent;color:#d5d5d5}.history-head{display:flex;align-items:center;justify-content:space-between;margin:40px 0 11px}h2{margin:0;font:700 12px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;color:#bcbcbc}.clear,.remove{padding:0;border:0;background:transparent;color:#888;font-size:12px;text-decoration:underline;text-underline-offset:3px}.clear:hover,.remove:hover{color:#fff}.history{max-height:390px;overflow:auto;border-top:1px solid var(--line)}.record{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:54px;border-bottom:1px solid var(--line);font:700 14px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace}.record-main,.record-actions{display:flex;align-items:center;gap:10px}.record span{color:var(--muted);font-size:12px;font-weight:600}.admin-tag{color:var(--ok)!important;font-size:10px!important;letter-spacing:.06em}.remove{border-left:1px solid var(--line);padding:4px 0 4px 10px}.empty{padding:20px 0;color:#777;border-bottom:1px solid var(--line);font-size:13px}.notice{margin:28px 0 0;color:#6e6e6e;font-size:12px;line-height:1.55}.screen{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:20px;background:var(--bg)}.screen.shade{z-index:4;background:rgb(0 0 0 / .75)}.dialog-card{width:min(100%,420px)}.dialog-card h1{margin-bottom:28px}.dialog-card h2{margin:0 0 10px;color:var(--text);font-family:inherit;font-size:21px;letter-spacing:-.04em}.dialog-card .check{width:100%;margin-top:10px}.dialog-card p{margin:0 0 18px;color:var(--muted);font-size:13px}.dialog-actions{display:grid;grid-template-columns:1fr 90px;gap:9px;margin-top:10px}.dialog-actions .pay{border-color:var(--text);background:var(--text)}.dialog-error{min-height:18px;margin:10px 0 0;color:var(--warn);font-size:12px;font-weight:700}@media(max-width:560px){.app{padding:21px 16px 38px}header{padding-bottom:25px}.count{margin:34px 0 25px}.entry{padding:15px}.form-row{grid-template-columns:1fr}.check{width:100%}.record{gap:9px}.record-actions{gap:7px}.record span{font-size:11px}}
@media(max-width:720px){body{min-height:100dvh}.app{padding:20px 14px 34px}header{padding-bottom:23px}.count{margin:30px 0 24px}.count strong{font-size:clamp(76px,27vw,112px)}.entry{padding:14px}.form-row{grid-template-columns:1fr;gap:8px}.check{width:100%}.status{margin-top:12px;padding-top:12px}.confirm{padding:15px;text-align:left}.confirm strong{margin:7px 0 14px;font-size:28px}.confirm-actions{grid-template-columns:1fr 1fr}.history-head{margin:30px 0 10px}.record{min-height:62px;gap:10px}.record-main{min-width:0}.record-actions{gap:8px;flex-shrink:0}.remove{padding-left:8px}.dialog-card{padding:16px}.dialog-card h1{margin-bottom:24px}}@media(max-width:390px){.app{padding-inline:12px}.record span{font-size:10px}.record-actions{gap:6px}.confirm-actions{gap:7px}}
  </style>
</head>
<body>
  <script>
    // The previous static-site addresses remain available as a friendly entry point.
    // Send them to the web service before any API call or operator-code entry.
    if (['festival-entry-check.onrender.com', 'festival-entry-gate.onrender.com'].includes(location.hostname)) {
      location.replace(`https://festival-entry-server.onrender.com${location.pathname}${location.search}${location.hash}`);
    }
  </script>
  <section id="gate" class="screen"><form id="gateForm" class="dialog-card"><p class="eyebrow">FESTIVAL / OPERATOR</p><h1>운영 코드</h1><label for="gateCode">코드 입력</label><input id="gateCode" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="4자리 코드" autofocus><button class="check" type="submit">입장 관리 열기</button><div id="gateError" class="dialog-error" aria-live="polite"></div></form></section>
  <main id="app" class="app" hidden>
    <header><p class="eyebrow">FESTIVAL / ENTRY CHECK</p><h1>학번 확인</h1></header>
    <section class="count"><strong id="total">0</strong><span>CHECKED IN · SERVER SAVED</span></section>
    <section class="entry"><label for="studentId">학번 입력</label><form id="checkForm" class="form-row"><input id="studentId" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="예: 1101" autofocus><button class="check" type="submit">입장 확인</button></form><div id="confirm" class="confirm" hidden aria-live="polite"><p id="confirmLabel">학번</p><strong id="confirmId"></strong><div id="confirmActions" class="confirm-actions"><button id="confirmEntry" class="pay" type="button">코인 지불 확인</button><button id="cancelEntry" class="cancel" type="button">취소</button></div></div><div id="status" class="status" aria-live="polite">학번을 입력해 주세요.<small>1~3학년 · 1~9반 · 01~30번 형식만 가능합니다. 예: 1101</small></div></section>
    <section><div class="history-head"><h2>입장 기록</h2><button id="clear" class="clear" type="button">오늘 기록 초기화</button></div><div id="history" class="history"></div></section><p class="notice">기록은 서버에 저장되어 모든 운영 기기에서 함께 적용됩니다.</p>
  </main>
  <section id="adminModal" class="screen shade" hidden><form id="adminForm" class="dialog-card"><h2 id="adminTitle">관리자 확인</h2><p id="adminDescription"></p><label for="adminCode">관리자 코드</label><input id="adminCode" inputmode="numeric" autocomplete="off" maxlength="4" placeholder="코드 입력"><div class="dialog-actions"><button class="pay" type="submit">실행</button><button id="adminCancel" class="cancel" type="button">취소</button></div><div id="adminError" class="dialog-error" aria-live="polite"></div></form></section>
  <script>
    const $=selector=>document.querySelector(selector);const gate=$('#gate'),app=$('#app'),gateForm=$('#gateForm'),gateCode=$('#gateCode'),gateError=$('#gateError');const form=$('#checkForm'),studentId=$('#studentId'),status=$('#status'),total=$('#total'),history=$('#history');const confirmBox=$('#confirm'),confirmLabel=$('#confirmLabel'),confirmId=$('#confirmId'),confirmEntry=$('#confirmEntry'),cancelEntry=$('#cancelEntry'),confirmActions=$('#confirmActions');const adminModal=$('#adminModal'),adminForm=$('#adminForm'),adminTitle=$('#adminTitle'),adminDescription=$('#adminDescription'),adminCode=$('#adminCode'),adminError=$('#adminError');let entries=[],pending=null,adminAction=null;const defaultDetail='1~3학년 · 1~9반 · 01~30번 형식만 가능합니다. 예: 1101';
    async function api(url,options={}){const response=await fetch(url,{headers:{'Content-Type':'application/json',...(options.headers||{})},...options});const data=await response.json().catch(()=>({}));if(!response.ok)throw{status:response.status,data};return data}function timeText(value){return new Intl.DateTimeFormat('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(new Date(value))}function show(type,message,detail=defaultDetail){status.className=`status ${type}`;status.innerHTML=`${message}<small>${detail}</small>`}function render(){total.textContent=entries.length;if(!entries.length){history.innerHTML='<div class="empty">아직 입장 기록이 없습니다.</div>';return}history.innerHTML=entries.map(entry=>`<div class="record"><div class="record-main"><b>${entry.student_id}</b>${entry.entry_type==='admin'?'<span class="admin-tag">관리자</span>':''}</div><div class="record-actions"><span>${timeText(entry.created_at)}</span><button class="remove" type="button" data-id="${entry.id}">삭제</button></div></div>`).join('')}async function loadEntries(){entries=(await api('/api/entries')).entries;render()}function disableEntry(disabled){studentId.disabled=disabled;$('.form-row .check').disabled=disabled}
    function closeConfirm(message='학번을 입력해 주세요.',detail=defaultDetail){pending=null;confirmBox.hidden=true;confirmBox.classList.remove('error');cancelEntry.hidden=false;confirmActions.classList.remove('single');disableEntry(false);studentId.value='';show('',message,detail);studentId.focus()}function openNotice(label,id,detail){pending={type:'notice'};confirmLabel.textContent=label;confirmId.textContent=id||'----';confirmEntry.textContent='확인';cancelEntry.hidden=true;confirmActions.classList.add('single');confirmBox.classList.add('error');confirmBox.hidden=false;disableEntry(true);show('warn',label,detail)}function openConfirm(id,type){pending={id,type};confirmLabel.textContent=type==='admin'?'관리자 계정 · 무제한 입장':'학번';confirmId.textContent=id;confirmEntry.textContent=type==='admin'?'입장 처리':'코인 지불 확인';cancelEntry.hidden=false;confirmActions.classList.remove('single');confirmBox.classList.remove('error');confirmBox.hidden=false;disableEntry(true);show('',type==='admin'?'관리자 계정입니다.':'코인 지불을 확인해 주세요.',type==='admin'?'관리자 계정은 횟수 제한 없이 입장할 수 있습니다.':'확인 전에는 입장 기록이 저장되지 않습니다.')}
    function openAdmin(action){adminAction=action;adminTitle.textContent=action.type==='clear'?'오늘 기록 초기화':'입장 기록 삭제';adminDescription.textContent=action.type==='clear'?'모든 입장 기록을 삭제합니다.':`${action.studentId} 기록을 삭제합니다.`;adminCode.value='';adminError.textContent='';adminModal.hidden=false;adminCode.focus()}function closeAdmin(){adminAction=null;adminModal.hidden=true}
    gateForm.addEventListener('submit',async event=>{event.preventDefault();gateError.textContent='';try{await api('/api/login',{method:'POST',body:JSON.stringify({code:gateCode.value})});gate.hidden=true;app.hidden=false;await loadEntries();studentId.focus()}catch(error){gateError.textContent=error.data?.message||'코드를 확인해 주세요.';gateCode.select()}});form.addEventListener('submit',async event=>{event.preventDefault();const id=studentId.value.trim();try{const result=await api('/api/check',{method:'POST',body:JSON.stringify({studentId:id})});if(!result.available)return openNotice('이미 입장한 학번',id,`첫 입장 처리: ${timeText(result.firstAt)}`);openConfirm(id,result.type)}catch(error){openNotice(error.status===422?'비정상적 코드':'확인 오류',id,error.data?.message||defaultDetail)}});studentId.addEventListener('input',()=>{studentId.value=studentId.value.replace(/\D/g,'')});confirmEntry.addEventListener('click',async()=>{if(!pending)return;if(pending.type==='notice')return closeConfirm();try{const result=await api('/api/entries',{method:'POST',body:JSON.stringify({studentId:pending.id})});await loadEntries();const saved=pending;closeConfirm(saved.type==='admin'?'관리자 입장 처리되었습니다.':'코인 지불이 확인되었습니다.',`${result.entry.student_id} · ${timeText(result.entry.created_at)}`)}catch(error){if(error.status===409)return openNotice('이미 입장한 학번',pending.id,`첫 입장 처리: ${timeText(error.data.firstAt)}`);openNotice('저장 오류',pending.id,error.data?.message||'서버 연결을 확인해 주세요.')}});cancelEntry.addEventListener('click',()=>closeConfirm('입장 기록을 만들지 않았습니다.','학번을 다시 입력해 주세요.'));history.addEventListener('click',event=>{const button=event.target.closest('.remove');if(button){const entry=entries.find(item=>String(item.id)===button.dataset.id);openAdmin({type:'delete',id:button.dataset.id,studentId:entry?.student_id||''})}});$('#clear').addEventListener('click',()=>{if(entries.length)openAdmin({type:'clear'})});$('#adminCancel').addEventListener('click',closeAdmin);adminForm.addEventListener('submit',async event=>{event.preventDefault();const action=adminAction;try{if(action.type==='clear')await api('/api/entries',{method:'DELETE',body:JSON.stringify({code:adminCode.value})});else await api(`/api/entries/${action.id}`,{method:'DELETE',body:JSON.stringify({code:adminCode.value})});closeAdmin();await loadEntries();show('',action.type==='clear'?'오늘 기록을 초기화했습니다.':'입장 기록을 삭제했습니다.','관리자 코드로 처리되었습니다.')}catch(error){adminError.textContent=error.data?.message||'처리할 수 없습니다.';adminCode.select()}});(async()=>{try{const session=await api('/api/session');if(session.active){gate.hidden=true;app.hidden=false;await loadEntries();studentId.focus()}}catch{gateError.textContent='서버에 연결할 수 없습니다.'}})();
  </script>
</body>
</html>
